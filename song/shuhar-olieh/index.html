<style>
:root{
  --bg:#f4f5fa; --card:#ffffff; --ink:#20233a; --graph:#2b2f45;
  --muted:#6b7189; --blue:#1a37e6; --blue-d:#12279c; --line:#dfe2ee;
  --tint:#eef1ff; --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Montserrat',system-ui,-apple-system,sans-serif;font-weight:400;
  color:var(--graph);background:var(--bg);line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  padding:max(24px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;position:relative;overflow-x:hidden;
}
.backdrop{position:fixed;inset:-40px;background-size:cover;background-position:center;
  filter:blur(60px) saturate(1.2);opacity:.22;z-index:0;transform:scale(1.15)}
.wrap{position:relative;z-index:1;width:100%;max-width:440px;margin:auto 0;
  display:flex;flex-direction:column;align-items:center;text-align:center}
.cover{width:min(78vw,300px);height:min(78vw,300px);border-radius:var(--radius);
  object-fit:cover;box-shadow:0 18px 50px -18px rgba(20,25,60,.45),0 2px 8px rgba(20,25,60,.08);
  background:var(--card)}
.cover.ph{display:grid;place-items:center;color:#c3c8dc;border:1px solid var(--line)}
h1{font-size:24px;font-weight:500;letter-spacing:-.01em;margin:26px 0 2px;color:var(--ink)}
.artist{font-size:15px;font-weight:500;letter-spacing:.02em;color:var(--blue);
  margin:0;text-transform:uppercase}
.date{font-size:12.5px;font-weight:400;color:var(--muted);margin-top:6px}
.subtitle{font-size:12.5px;font-weight:400;color:var(--muted);margin:14px 0 4px;
  letter-spacing:.03em}
.list{width:100%;display:flex;flex-direction:column;gap:11px;margin-top:22px}
.btn{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;
  border:1.5px solid var(--line);border-radius:14px;background:var(--card);
  color:var(--graph);text-decoration:none;font-weight:500;font-size:15.5px;
  transition:border-color .18s,background .18s,transform .12s,box-shadow .18s}
.btn:hover{border-color:var(--blue);background:var(--tint);
  box-shadow:0 8px 22px -12px rgba(26,55,230,.5)}
.btn:active{transform:scale(.99)}
.btn .ic{width:24px;height:24px;display:grid;place-items:center;flex:0 0 24px}
.btn .ic.badge{border-radius:8px;font-size:13px;font-weight:600;width:26px;height:26px}
.btn .nm{flex:1;text-align:left}
.btn .go{color:var(--muted);flex:0 0 auto}
.btn:hover .go{color:var(--blue)}
.empty{color:var(--muted);font-size:14px;margin-top:22px}
footer{position:relative;z-index:1;margin-top:38px;display:flex;flex-direction:column;
  align-items:center;gap:8px}
footer img{height:22px;width:auto;opacity:.9}
footer .cap{font-size:10px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--muted);font-weight:500}
@media(min-width:480px){h1{font-size:27px}}
</style>
</head>
