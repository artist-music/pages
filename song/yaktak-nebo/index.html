<style>
:root{
  --bg:#23252d; --card:#2c2f39; --card-h:#343845; --ink:#f2f4fa;
  --muted:#9298ab; --accent:#aeb9ff; --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Montserrat',system-ui,-apple-system,sans-serif;font-weight:400;
  color:var(--ink);background:var(--bg);line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden;
  padding:max(34px,env(safe-area-inset-top)) 18px max(30px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;
}
/* Матовий графітовий фон — ледь помітна глибина, без кольору */
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,#282b34 0%,#23252d 55%,#1b1d23 100%)}
.wrap{width:100%;max-width:430px;margin:auto 0;display:flex;flex-direction:column;
  align-items:center;text-align:center}
.cover{width:min(70vw,272px);height:min(70vw,272px);border-radius:var(--radius);
  object-fit:cover;background:#2b2e38;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.05)}
.artist{font-size:13px;font-weight:500;letter-spacing:.16em;color:var(--accent);
  margin:26px 0 7px;text-transform:uppercase}
h1{font-size:27px;font-weight:500;letter-spacing:-.01em;margin:0;color:#fff}
.subtitle{font-size:12.5px;font-weight:400;color:var(--muted);margin:18px 0 0;
  letter-spacing:.04em}
.list{width:100%;display:flex;flex-direction:column;gap:11px;margin-top:24px}
.btn{display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;
  border:none;border-radius:14px;background:var(--card);color:#fff;
  text-decoration:none;font-weight:500;font-size:15.5px;
  box-shadow:0 1px 2px rgba(0,0,0,.22);
  transition:background .16s,transform .12s}
.btn:hover{background:var(--card-h);transform:translateY(-1px)}
.btn:active{transform:scale(.99)}
.btn .ic{width:24px;height:24px;display:grid;place-items:center;flex:0 0 24px}
.btn .ic.badge{border-radius:8px;font-size:13px;font-weight:600;width:26px;height:26px}
.btn .nm{flex:1;text-align:left}
.btn .go{color:var(--muted);flex:0 0 auto}
.btn:hover .go{color:var(--accent)}
.empty{color:var(--muted);font-size:14px;margin-top:22px}
footer{margin-top:42px;display:flex;flex-direction:column;align-items:center;gap:10px}
footer img{height:26px;width:auto;filter:brightness(0) invert(1);opacity:.92}
footer .cap{font-size:10px;letter-spacing:.36em;text-transform:uppercase;
  color:var(--muted);font-weight:500}
@media(min-width:480px){h1{font-size:30px}}
</style>
